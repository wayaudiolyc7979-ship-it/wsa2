<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Stereo Loudness — PRISM INTENSE</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#030305; display:flex; flex-direction:column; align-items:center;
         padding:30px 20px; gap:30px; font-family:'SF Mono','Fira Code',monospace; }
  .label { font-size:9px; letter-spacing:5px; color:rgba(255,255,255,0.2); align-self:flex-start; margin-left:4px; }
  canvas { display:block; border-radius:3px; }
</style>
</head>
<body>
<div class="label">PRISM INTENSE — V1 &nbsp;·&nbsp; HIGH CONTRAST SPECTRUM</div>
<canvas id="c1" width="980" height="380"></canvas>

<div class="label">PRISM INTENSE — V2 &nbsp;·&nbsp; DARK MODE + BLOOM</div>
<canvas id="c2" width="980" height="380"></canvas>

<script>
// ── HSL helper ──────────────────────────────────────────────────────────────
function hsl(h,s,l,a=1){ return `hsla(${h},${s}%,${l}%,${a})`; }
function hslRgb(h,s,l){
  s/=100;l/=100;
  const k=n=>(n+h/30)%12;
  const a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return [Math.round(f(0)*255),Math.round(f(8)*255),Math.round(f(4)*255)];
}

// ── Spectrum color by fraction (0→1 maps to violet→blue→cyan→green→yellow→red)
function specColor(frac, lightness=60, alpha=1){
  const h = (1-frac)*260 + frac*0; // 260(violet)→0(red)
  return hsl(h, 100, lightness, alpha);
}
function specRgb(frac, l=60){ return hslRgb((1-frac)*260, 100, l); }

// ── Rose noise (deterministic)
function roseData(N){
  const pts=[];
  for(let i=0;i<=N;i++){
    const n=0.52+0.48*(
      Math.sin(i*0.13+0.4)*Math.cos(i*0.07+1.6)*0.55+
      Math.sin(i*0.21+2.0)*0.35+
      Math.sin(i*0.05+0.7)*0.1
    );
    pts.push(Math.max(0.06, n));
  }
  return pts;
}

// ── Arc meter ───────────────────────────────────────────────────────────────
function arcMeter(g,cx,cy,rOuter,arcW,litFrac,colorFn){
  const N=72, startD=225, span=300;
  for(let i=0;i<N;i++){
    const f=i/N;
    const a1=(startD - i*(span/N))*Math.PI/180;
    const a2=(startD - (i+0.78)*(span/N))*Math.PI/180;
    g.beginPath();
    g.arc(cx,cy,rOuter,a1,a2,true);
    g.arc(cx,cy,rOuter-arcW,a2,a1,false);
    g.closePath(); g.fillStyle=colorFn(f,f<litFrac); g.fill();
  }
}

// ── Lissajous ───────────────────────────────────────────────────────────────
function drawLissajous(g,cx,cy,r,colorFn){
  for(let i=0;i<2000;i++){
    const t=i/2000*Math.PI*11.3;
    const lv=Math.sin(t)*0.63+Math.sin(t*0.71+0.9)*0.27+Math.sin(t*0.29)*0.1;
    const rv=Math.sin(t*1.04+0.48)*0.57+Math.cos(t*0.39)*0.35+Math.sin(t*0.19+1)*0.08;
    const px=cx+lv*r*0.87; const py=cy-rv*r*0.87;
    const age=i/2000;
    const [rc,gc,bc,a]=colorFn(age);
    g.fillStyle=`rgba(${rc},${gc},${bc},${a})`;
    const sz= age>0.85 ? 2.5 : age>0.6 ? 1.8 : 1.2;
    g.fillRect(px-sz/2,py-sz/2,sz,sz);
  }
}

// ─────────────────────────────────────────────────────────────────────────────
//  VERSION 1 — HIGH CONTRAST SPECTRUM
// ─────────────────────────────────────────────────────────────────────────────
(function(){
  const cv=document.getElementById('c1');
  const g=cv.getContext('2d');
  const W=980,H=380;

  // BG — pure near-black
  g.fillStyle='#020204'; g.fillRect(0,0,W,H);

  // ── VECTORSCOPE ────────────────────────────────────────────────────────
  const vcx=232,vcy=172,vr=140;

  // subtle background bloom behind scope
  const bloom=g.createRadialGradient(vcx,vcy,0,vcx,vcy,vr*1.6);
  bloom.addColorStop(0,'rgba(60,40,140,0.18)');
  bloom.addColorStop(0.5,'rgba(40,20,100,0.08)');
  bloom.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=bloom; g.fillRect(vcx-vr*1.7,vcy-vr*1.7,vr*3.4,vr*3.4);

  // circle BG
  g.beginPath(); g.arc(vcx,vcy,vr,0,Math.PI*2);
  g.fillStyle='rgba(5,5,15,0.95)'; g.fill();

  // spectrum outer ring (gradient stroke)
  // draw as thin arcs in each color
  const RingN=180;
  for(let i=0;i<RingN;i++){
    const f=i/RingN;
    const a1=(f*360-90)*Math.PI/180;
    const a2=((f+1/RingN)*360-90)*Math.PI/180;
    g.beginPath(); g.arc(vcx,vcy,vr,a1,a2);
    g.strokeStyle=specColor(f,65,0.85); g.lineWidth=1.8; g.stroke();
  }

  // reference rings
  [0.33,0.67].forEach(f=>{
    g.beginPath(); g.arc(vcx,vcy,vr*f,0,Math.PI*2);
    g.strokeStyle='rgba(255,255,255,0.05)'; g.lineWidth=0.6; g.stroke();
  });

  // axes
  const d=vr*0.707;
  g.setLineDash([3,6]); g.strokeStyle='rgba(255,255,255,0.07)'; g.lineWidth=0.7;
  [[vcx-d,vcy-d,vcx+d,vcy+d],[vcx-d,vcy+d,vcx+d,vcy-d]].forEach(([x1,y1,x2,y2])=>{
    g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke();
  });
  g.setLineDash([]); g.strokeStyle='rgba(255,255,255,0.09)'; g.lineWidth=0.8;
  [[vcx-vr,vcy,vcx+vr,vcy],[vcx,vcy-vr,vcx,vcy+vr]].forEach(([x1,y1,x2,y2])=>{
    g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke();
  });

  // Lissajous — full spectrum trail
  drawLissajous(g,vcx,vcy,vr,(age)=>{
    const [r,gc,b]=specRgb(age,58+age*12);
    return [r,gc,b, 0.08+age*0.85];
  });

  // hot core highlight at center mass
  const core=g.createRadialGradient(vcx+6,vcy-4,0,vcx+6,vcy-4,vr*0.22);
  core.addColorStop(0,'rgba(255,255,255,0.12)'); core.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=core; g.beginPath(); g.arc(vcx+6,vcy-4,vr*0.22,0,Math.PI*2); g.fill();

  // Phase bar — spectrum gradient
  const bw=220,bh=7,bx=vcx-110,by=vcy+vr+18;
  const barBG=g.createLinearGradient(bx,by,bx+bw,by);
  barBG.addColorStop(0,specColor(0,55,0.15));
  barBG.addColorStop(0.5,'rgba(255,255,255,0.04)');
  barBG.addColorStop(1,specColor(1,55,0.15));
  g.fillStyle=barBG; g.fillRect(bx,by,bw,bh);
  // active fill (corr=0.72)
  const fw=0.72*(bw/2);
  const fillG=g.createLinearGradient(bx+bw/2,by,bx+bw/2+fw,by);
  fillG.addColorStop(0,specColor(0.55,70,0.9));
  fillG.addColorStop(1,specColor(0.8,70,0.9));
  g.fillStyle=fillG; g.fillRect(bx+bw/2,by,fw,bh);
  // center tick
  g.strokeStyle='rgba(255,255,255,0.55)'; g.lineWidth=1;
  g.beginPath(); g.moveTo(bx+bw/2,by-4); g.lineTo(bx+bw/2,by+bh+4); g.stroke();
  // corr value
  g.textAlign='center'; g.font='bold 11px monospace';
  g.fillStyle=specColor(0.72,75,1); g.fillText('+0.72',bx+bw/2+fw/2+8,by-7);

  g.font='8px monospace'; g.fillStyle='rgba(255,255,255,0.18)';
  ['−1','0','+1'].forEach((t,i)=>g.fillText(t,bx+i*(bw/2),by+bh+13));

  // Labels
  g.font='bold 9px monospace';
  g.fillStyle='rgba(255,255,255,0.35)'; g.fillText('VECTORSCOPE',vcx,vcy-vr-16);
  g.fillStyle=specColor(0.85,75,0.75); g.fillText('L',vcx+vr+10,vcy+5);
  g.fillStyle=specColor(0.1,75,0.75);  g.fillText('L',vcx-vr-10,vcy+5);
  g.fillStyle=specColor(0.5,75,0.75);  g.fillText('R',vcx,vcy-vr-10); g.fillText('R',vcx,vcy+vr+15);
  g.textAlign='left';

  // ── LOUDNESS RADAR ─────────────────────────────────────────────────────
  const rcx=658,rcy=172,rr=140,arcW=15,Rin=20,Rout=rr-arcW-4;

  // background bloom (warm)
  const rbloom=g.createRadialGradient(rcx,rcy,0,rcx,rcy,rr*1.6);
  rbloom.addColorStop(0,'rgba(140,40,20,0.15)'); rbloom.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=rbloom; g.fillRect(rcx-rr*1.7,rcy-rr*1.7,rr*3.4,rr*3.4);

  // rose BG
  g.beginPath(); g.arc(rcx,rcy,Rout,0,Math.PI*2);
  g.fillStyle='rgba(3,3,8,0.98)'; g.fill();

  // radial grid
  for(let deg=0;deg<360;deg+=30){
    const a=deg*Math.PI/180;
    g.beginPath(); g.moveTo(rcx+Rin*Math.cos(a),rcy+Rin*Math.sin(a));
    g.lineTo(rcx+Rout*Math.cos(a),rcy+Rout*Math.sin(a));
    g.strokeStyle='rgba(255,255,255,0.04)'; g.lineWidth=0.6; g.stroke();
  }
  [0.33,0.67,1.0].forEach(f=>{
    g.beginPath(); g.arc(rcx,rcy,Rin+(Rout-Rin)*f,0,Math.PI*2);
    g.strokeStyle=`rgba(255,255,255,${f===1?0.07:0.03})`; g.lineWidth=0.5; g.stroke();
  });

  // Rose fill — spectrum gradient (by radius = by loudness level)
  const rG=g.createRadialGradient(rcx,rcy,Rin,rcx,rcy,Rout);
  // indigo(quiet)→blue→cyan→green→yellow→orange→red(loud)
  rG.addColorStop(0,   'hsla(260,100%,55%,0)');
  rG.addColorStop(0.12,'hsla(260,100%,55%,0.7)');
  rG.addColorStop(0.3, 'hsla(200,100%,55%,0.75)');
  rG.addColorStop(0.5, 'hsla(150,100%,50%,0.75)');
  rG.addColorStop(0.68,'hsla(60,100%,55%,0.8)');
  rG.addColorStop(0.85,'hsla(25,100%,55%,0.82)');
  rG.addColorStop(1.0, 'hsla(0,100%,50%,0.75)');

  const rose=roseData(160);
  g.beginPath();
  rose.forEach((n,i)=>{
    const angle=(i/160)*Math.PI*2-Math.PI/2;
    const r2=Rin+(Rout-Rin)*n*0.54;
    i===0?g.moveTo(rcx+r2*Math.cos(angle),rcy+r2*Math.sin(angle))
         :g.lineTo(rcx+r2*Math.cos(angle),rcy+r2*Math.sin(angle));
  });
  g.closePath(); g.fillStyle=rG; g.fill();

  // rose edge stroke (same gradient, bright)
  g.beginPath();
  rose.forEach((n,i)=>{
    const angle=(i/160)*Math.PI*2-Math.PI/2;
    const r2=Rin+(Rout-Rin)*n*0.54;
    i===0?g.moveTo(rcx+r2*Math.cos(angle),rcy+r2*Math.sin(angle))
         :g.lineTo(rcx+r2*Math.cos(angle),rcy+r2*Math.sin(angle));
  });
  g.closePath();
  const edgeG=g.createRadialGradient(rcx,rcy,Rin,rcx,rcy,Rout);
  edgeG.addColorStop(0,'hsla(260,100%,70%,0)'); edgeG.addColorStop(0.7,'hsla(60,100%,70%,0.4)'); edgeG.addColorStop(1,'hsla(0,100%,65%,0.6)');
  g.strokeStyle=edgeG; g.lineWidth=1.2; g.stroke();

  // center hole
  g.beginPath(); g.arc(rcx,rcy,Rin,0,Math.PI*2);
  g.fillStyle='rgba(3,3,8,0.98)'; g.fill();

  // Arc meter — fully saturated spectrum
  arcMeter(g,rcx,rcy,rr,arcW,0.62,(frac,lit)=>{
    if(!lit) return 'rgba(255,255,255,0.04)';
    return specColor(frac,60,0.92);
  });

  // outer ring (spectrum)
  for(let i=0;i<180;i++){
    const f=i/180;
    const a1=(f*360-90)*Math.PI/180, a2=((f+1.1/180)*360-90)*Math.PI/180;
    g.beginPath(); g.arc(rcx,rcy,rr,a1,a2);
    g.strokeStyle=specColor(f,65,0.5); g.lineWidth=1.5; g.stroke();
  }

  // target line
  const tf=((-23)-(-52))/(2-(-52));
  const td=(225-tf*300)*Math.PI/180;
  g.beginPath();
  g.moveTo(rcx+(rr-arcW-2)*Math.cos(td),rcy+(rr-arcW-2)*Math.sin(td));
  g.lineTo(rcx+(rr+7)*Math.cos(td),rcy+(rr+7)*Math.sin(td));
  g.strokeStyle='rgba(255,255,255,0.8)'; g.lineWidth=2; g.stroke();
  // label
  const lr=rr+18;
  g.textAlign='center'; g.font='bold 8px monospace'; g.fillStyle='rgba(255,255,255,0.4)';
  g.fillText('−23',rcx+lr*Math.cos(td),rcy+lr*Math.sin(td));

  // scanning sweep
  const sweepAngle=(-30)*Math.PI/180;
  const swG=g.createLinearGradient(
    rcx,rcy,
    rcx+(Rout)*Math.cos(sweepAngle),
    rcy+(Rout)*Math.sin(sweepAngle)
  );
  swG.addColorStop(0,'rgba(255,255,255,0)');
  swG.addColorStop(0.7,'rgba(255,255,255,0.06)');
  swG.addColorStop(1,'rgba(255,255,255,0.25)');
  g.beginPath();
  g.moveTo(rcx,rcy);
  g.arc(rcx,rcy,Rout,sweepAngle-0.18,sweepAngle,false);
  g.closePath(); g.fillStyle=swG; g.fill();

  g.font='bold 9px monospace'; g.fillStyle='rgba(255,255,255,0.3)';
  g.fillText('LOUDNESS RADAR',rcx,rcy-rr-16);
  g.textAlign='left';

  // ── BOTTOM PANEL ──────────────────────────────────────────────────────
  const py=316,ph=64;
  g.fillStyle='#020204'; g.fillRect(0,py,W,ph);

  // top edge — full spectrum line
  const topLine=g.createLinearGradient(0,py,W,py);
  const hues=[260,200,150,60,25,0];
  hues.forEach((h,i)=>topLine.addColorStop(i/(hues.length-1),`hsla(${h},100%,60%,0.8)`));
  g.fillStyle=topLine; g.fillRect(0,py,W,2);

  // metric colors follow spectrum position
  const metrics=[
    {label:'M  MOMENTARY',    val:'-18.4',unit:'LUFS',hue:240,big:false,x:96 },
    {label:'S  SHORT-TERM',   val:'-19.1',unit:'LUFS',hue:190,big:false,x:248},
    {label:'PROGRAM LOUDNESS',val:'-18.7',unit:'LUFS',hue:140,big:true, x:430},
    {label:'TRUE-PEAK MAX',   val:'-1.2', unit:'dBTP',hue:40, big:true, x:630},
    {label:'LOUDNESS RANGE',  val:'8.3',  unit:'LU',  hue:15, big:false,x:826},
  ];

  // subtle glow spot under big metrics
  [metrics[2],metrics[3]].forEach(m=>{
    const mg=g.createRadialGradient(m.x,py+35,0,m.x,py+35,55);
    mg.addColorStop(0,hsl(m.hue,100,55,0.12)); mg.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=mg; g.fillRect(m.x-60,py,120,ph);
  });

  [172,338,524,726].forEach(sx=>{
    g.beginPath(); g.moveTo(sx,py+10); g.lineTo(sx,py+ph-10);
    g.strokeStyle='rgba(255,255,255,0.06)'; g.lineWidth=1; g.stroke();
  });

  g.textAlign='center';
  metrics.forEach(m=>{
    g.font='8px monospace'; g.fillStyle='rgba(255,255,255,0.25)';
    g.fillText(m.label,m.x,py+16);
    const fs=m.big?30:22; g.font=`bold ${fs}px monospace`;
    g.fillStyle=hsl(m.hue,100,m.big?68:60,1);
    g.fillText(m.val,m.x,py+46);
    g.font='8px monospace'; g.fillStyle='rgba(255,255,255,0.2)';
    g.fillText(m.unit,m.x,py+60);
  });
  g.textAlign='left';
})();


// ─────────────────────────────────────────────────────────────────────────────
//  VERSION 2 — DARK BLOOM (같은 팔레트, 글로우 강화 + 더 극적인 대비)
// ─────────────────────────────────────────────────────────────────────────────
(function(){
  const cv=document.getElementById('c2');
  const g=cv.getContext('2d');
  const W=980,H=380;
  g.fillStyle='#010103'; g.fillRect(0,0,W,H);

  // ── VECTORSCOPE ────────────────────────────────────────────────────────
  const vcx=232,vcy=172,vr=140;

  // large background halo
  const halo=g.createRadialGradient(vcx,vcy,vr*0.3,vcx,vcy,vr*2.2);
  halo.addColorStop(0,'rgba(50,20,120,0.3)'); halo.addColorStop(0.4,'rgba(20,10,60,0.12)'); halo.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=halo; g.fillRect(vcx-vr*2.3,vcy-vr*2.3,vr*4.6,vr*4.6);

  // BG circle
  g.beginPath(); g.arc(vcx,vcy,vr,0,Math.PI*2);
  g.fillStyle='rgba(3,2,10,0.97)'; g.fill();

  // bright spectrum ring (2-layer: glow + crisp)
  for(let pass=0;pass<2;pass++){
    const N=180;
    for(let i=0;i<N;i++){
      const f=i/N;
      const a1=(f*360-90)*Math.PI/180, a2=((f+1.2/N)*360-90)*Math.PI/180;
      g.beginPath(); g.arc(vcx,vcy,vr,a1,a2);
      if(pass===0){
        g.strokeStyle=specColor(f,55,0.25); g.lineWidth=6; // wide glow
      } else {
        g.strokeStyle=specColor(f,70,0.9); g.lineWidth=1.8; // crisp
      }
      g.stroke();
    }
  }

  // Axes (very subtle)
  const d=vr*0.707;
  g.setLineDash([2,8]); g.strokeStyle='rgba(255,255,255,0.05)'; g.lineWidth=0.6;
  [[vcx-d,vcy-d,vcx+d,vcy+d],[vcx-d,vcy+d,vcx+d,vcy-d]].forEach(([x1,y1,x2,y2])=>{g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();});
  g.setLineDash([]); g.strokeStyle='rgba(255,255,255,0.06)'; g.lineWidth=0.7;
  [[vcx-vr,vcy,vcx+vr,vcy],[vcx,vcy-vr,vcx,vcy+vr]].forEach(([x1,y1,x2,y2])=>{g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();});

  // Lissajous — 2-pass (glow + crisp)
  // Pass 1: blurred glow (simulate with larger semi-transparent pixels)
  for(let pass=0;pass<2;pass++){
    for(let i=0;i<(pass===0?800:2000);i++){
      const idx=pass===0?i/800:i/2000;
      const t=idx*Math.PI*11.3;
      const lv=Math.sin(t)*0.63+Math.sin(t*0.71+0.9)*0.27+Math.sin(t*0.29)*0.1;
      const rv=Math.sin(t*1.04+0.48)*0.57+Math.cos(t*0.39)*0.35+Math.sin(t*0.19+1)*0.08;
      const px=vcx+lv*vr*0.87, py=vcy-rv*vr*0.87;
      const age=idx;
      const [r2,gc,b]=specRgb(age,pass===0?55:62);
      if(pass===0){
        g.fillStyle=`rgba(${r2},${gc},${b},${age*0.15})`;
        g.fillRect(px-3,py-3,6,6);
      } else {
        const sz=age>0.88?3:age>0.65?2:1.2;
        g.fillStyle=`rgba(${r2},${gc},${b},${0.05+age*0.88})`;
        g.fillRect(px-sz/2,py-sz/2,sz,sz);
      }
    }
  }

  // bright tip (newest point)
  { const t=Math.PI*11.3;
    const lv=Math.sin(t)*0.63+Math.sin(t*0.71+0.9)*0.27;
    const rv=Math.sin(t*1.04+0.48)*0.57+Math.cos(t*0.39)*0.35;
    const px=vcx+lv*vr*0.87,py=vcy-rv*vr*0.87;
    const tip=g.createRadialGradient(px,py,0,px,py,6);
    tip.addColorStop(0,'rgba(255,255,255,0.9)'); tip.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=tip; g.beginPath(); g.arc(px,py,6,0,Math.PI*2); g.fill();
  }

  // Phase bar — glow version
  const bw=220,bh=8,bx=vcx-110,by=vcy+vr+18;
  // bg track
  const trackG=g.createLinearGradient(bx,0,bx+bw,0);
  trackG.addColorStop(0,specColor(0,45,0.08)); trackG.addColorStop(0.5,'rgba(255,255,255,0.03)'); trackG.addColorStop(1,specColor(1,45,0.08));
  g.fillStyle=trackG; g.fillRect(bx,by,bw,bh);
  // glow fill (2-layer)
  const fw=0.72*(bw/2);
  [8,3].forEach((blur,pi)=>{
    const fG=g.createLinearGradient(bx+bw/2,by,bx+bw/2+fw,by);
    fG.addColorStop(0,specColor(0.5,65,pi===0?0.35:0.9));
    fG.addColorStop(1,specColor(0.85,65,pi===0?0.2:0.85));
    g.fillStyle=fG;
    if(pi===0) g.fillRect(bx+bw/2-blur,by-blur,fw+blur*2,bh+blur*2);
    else g.fillRect(bx+bw/2,by,fw,bh);
  });
  // center tick
  g.strokeStyle='rgba(255,255,255,0.6)'; g.lineWidth=1.2;
  g.beginPath(); g.moveTo(bx+bw/2,by-5); g.lineTo(bx+bw/2,by+bh+5); g.stroke();

  g.textAlign='center';
  g.font='bold 11px monospace'; g.fillStyle=specColor(0.75,80,1);
  g.fillText('+0.72',bx+bw/2+fw/2+8,by-8);
  g.font='8px monospace'; g.fillStyle='rgba(255,255,255,0.18)';
  ['−1','0','+1'].forEach((t,i)=>g.fillText(t,bx+i*(bw/2),by+bh+13));

  g.font='bold 10px monospace'; g.fillStyle='rgba(255,255,255,0.4)';
  g.fillText('VECTORSCOPE',vcx,vcy-vr-17);
  const axLabels=[[vcx+vr+10,vcy+5,0.85],[vcx-vr-10,vcy+5,0.1],[vcx,vcy-vr-10,0.5],[vcx,vcy+vr+15,0.5]];
  axLabels.forEach(([x,y,f])=>{
    g.font='bold 10px monospace'; g.fillStyle=specColor(f,80,0.7);
    g.fillText(f<0.3||f>0.7?'L':'R',x,y);
  });
  g.textAlign='left';

  // ── LOUDNESS RADAR ─────────────────────────────────────────────────────
  const rcx=658,rcy=172,rr=140,arcW=15,Rin=20,Rout=rr-arcW-4;

  // background halo (warm)
  const rhalo=g.createRadialGradient(rcx,rcy,vr*0.3,rcx,rcy,vr*2.2);
  rhalo.addColorStop(0,'rgba(120,30,10,0.25)'); rhalo.addColorStop(0.4,'rgba(60,15,5,0.1)'); rhalo.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=rhalo; g.fillRect(rcx-rr*2.3,rcy-rr*2.3,rr*4.6,rr*4.6);

  // BG
  g.beginPath(); g.arc(rcx,rcy,Rout,0,Math.PI*2);
  g.fillStyle='rgba(2,2,6,0.98)'; g.fill();

  // Grid
  for(let deg=0;deg<360;deg+=30){
    const a=deg*Math.PI/180;
    g.beginPath(); g.moveTo(rcx+Rin*Math.cos(a),rcy+Rin*Math.sin(a));
    g.lineTo(rcx+Rout*Math.cos(a),rcy+Rout*Math.sin(a));
    g.strokeStyle='rgba(255,255,255,0.04)'; g.lineWidth=0.6; g.stroke();
  }

  // Rose — 2-pass (glow underlay + solid fill)
  const rose=roseData(160);
  function drawRose(sc){
    g.beginPath();
    rose.forEach((n,i)=>{
      const angle=(i/160)*Math.PI*2-Math.PI/2;
      const r2=Rin+(Rout-Rin)*n*sc;
      i===0?g.moveTo(rcx+r2*Math.cos(angle),rcy+r2*Math.sin(angle))
           :g.lineTo(rcx+r2*Math.cos(angle),rcy+r2*Math.sin(angle));
    });
    g.closePath();
  }

  // pass 1 — wide glow
  drawRose(0.57);
  const gG1=g.createRadialGradient(rcx,rcy,Rin,rcx,rcy,Rout);
  gG1.addColorStop(0,   'hsla(260,100%,55%,0)');
  gG1.addColorStop(0.15,'hsla(260,100%,55%,0.4)');
  gG1.addColorStop(0.4, 'hsla(190,100%,55%,0.35)');
  gG1.addColorStop(0.62,'hsla(120,100%,50%,0.35)');
  gG1.addColorStop(0.8, 'hsla(45,100%,55%,0.35)');
  gG1.addColorStop(1.0, 'hsla(0,100%,55%,0.3)');
  g.fillStyle=gG1; g.fill();

  // pass 2 — solid
  drawRose(0.54);
  const gG2=g.createRadialGradient(rcx,rcy,Rin,rcx,rcy,Rout);
  gG2.addColorStop(0,   'hsla(260,100%,60%,0)');
  gG2.addColorStop(0.12,'hsla(260,100%,60%,0.85)');
  gG2.addColorStop(0.32,'hsla(200,100%,58%,0.85)');
  gG2.addColorStop(0.52,'hsla(140,100%,52%,0.85)');
  gG2.addColorStop(0.7, 'hsla(55,100%,58%,0.88)');
  gG2.addColorStop(0.87,'hsla(20,100%,58%,0.88)');
  gG2.addColorStop(1.0, 'hsla(0,100%,55%,0.82)');
  g.fillStyle=gG2; g.fill();

  // bright edge stroke on rose
  drawRose(0.54);
  const edgeG=g.createRadialGradient(rcx,rcy,Rin,rcx,rcy,Rout);
  edgeG.addColorStop(0.5,'hsla(100,100%,65%,0.2)');
  edgeG.addColorStop(0.8,'hsla(40,100%,68%,0.5)');
  edgeG.addColorStop(1.0,'hsla(0,100%,62%,0.7)');
  g.strokeStyle=edgeG; g.lineWidth=1.5; g.stroke();

  // center
  g.beginPath(); g.arc(rcx,rcy,Rin,0,Math.PI*2); g.fillStyle='rgba(2,2,6,0.98)'; g.fill();

  // center glow dot
  const cdot=g.createRadialGradient(rcx,rcy,0,rcx,rcy,Rin);
  cdot.addColorStop(0,'hsla(260,100%,70%,0.6)'); cdot.addColorStop(1,'hsla(260,100%,55%,0)');
  g.fillStyle=cdot; g.beginPath(); g.arc(rcx,rcy,Rin,0,Math.PI*2); g.fill();

  // Arc meter — 2-layer
  // glow pass
  arcMeter(g,rcx,rcy,rr+3,arcW+6,0.62,(frac,lit)=>{
    if(!lit) return 'transparent';
    return specColor(frac,60,0.18);
  });
  // crisp pass
  arcMeter(g,rcx,rcy,rr,arcW,0.62,(frac,lit)=>{
    if(!lit) return 'rgba(255,255,255,0.03)';
    return specColor(frac,65,0.95);
  });

  // outer ring — glow + crisp
  for(let pass=0;pass<2;pass++){
    for(let i=0;i<180;i++){
      const f=i/180;
      const a1=(f*360-90)*Math.PI/180, a2=((f+1.2/180)*360-90)*Math.PI/180;
      g.beginPath(); g.arc(rcx,rcy,rr,a1,a2);
      if(pass===0){ g.strokeStyle=specColor(f,60,0.2); g.lineWidth=5; }
      else         { g.strokeStyle=specColor(f,70,0.85); g.lineWidth=1.5; }
      g.stroke();
    }
  }

  // target line (-23 LUFS)
  const tf=((-23)-(-52))/(2-(-52));
  const td=(225-tf*300)*Math.PI/180;
  g.beginPath();
  g.moveTo(rcx+(rr-arcW-2)*Math.cos(td),rcy+(rr-arcW-2)*Math.sin(td));
  g.lineTo(rcx+(rr+8)*Math.cos(td),rcy+(rr+8)*Math.sin(td));
  g.strokeStyle='rgba(255,255,255,0.85)'; g.lineWidth=2; g.stroke();
  // bright dot on target
  g.beginPath(); g.arc(rcx+(rr-arcW/2)*Math.cos(td),rcy+(rr-arcW/2)*Math.sin(td),2.5,0,Math.PI*2);
  g.fillStyle='rgba(255,255,255,0.9)'; g.fill();

  g.textAlign='center'; g.font='8px monospace'; g.fillStyle='rgba(255,255,255,0.4)';
  const lr=rr+18;
  g.fillText('−23',rcx+lr*Math.cos(td),rcy+lr*Math.sin(td)+4);
  g.font='bold 10px monospace'; g.fillStyle='rgba(255,255,255,0.35)';
  g.fillText('LOUDNESS RADAR',rcx,rcy-rr-17);
  g.textAlign='left';

  // ── BOTTOM PANEL ──────────────────────────────────────────────────────
  const py=316,ph=64;
  g.fillStyle='#010103'; g.fillRect(0,py,W,ph);

  // 2px spectrum top line with slight glow behind
  const glowLine=g.createLinearGradient(0,py,W,py);
  const hues=[260,200,150,60,25,0];
  // glow
  hues.forEach((h,i)=>glowLine.addColorStop(i/(hues.length-1),`hsla(${h},100%,55%,0.25)`));
  g.fillStyle=glowLine; g.fillRect(0,py-3,W,8);
  // crisp
  const sharpLine=g.createLinearGradient(0,py,W,py);
  hues.forEach((h,i)=>sharpLine.addColorStop(i/(hues.length-1),`hsla(${h},100%,65%,0.95)`));
  g.fillStyle=sharpLine; g.fillRect(0,py,W,2);

  const metrics=[
    {label:'M  MOMENTARY',    val:'-18.4',unit:'LUFS',hue:240,big:false,x:96},
    {label:'S  SHORT-TERM',   val:'-19.1',unit:'LUFS',hue:190,big:false,x:248},
    {label:'PROGRAM LOUDNESS',val:'-18.7',unit:'LUFS',hue:140,big:true, x:430},
    {label:'TRUE-PEAK MAX',   val:'-1.2', unit:'dBTP',hue:45, big:true, x:630},
    {label:'LOUDNESS RANGE',  val:'8.3',  unit:'LU',  hue:15, big:false,x:826},
  ];

  // glow spot under big values
  [metrics[2],metrics[3]].forEach(m=>{
    const sg=g.createRadialGradient(m.x,py+32,0,m.x,py+32,65);
    sg.addColorStop(0,hsl(m.hue,100,50,0.18)); sg.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=sg; g.fillRect(m.x-70,py,140,ph);
  });

  [172,338,524,726].forEach(sx=>{
    g.beginPath(); g.moveTo(sx,py+10); g.lineTo(sx,py+ph-10);
    g.strokeStyle='rgba(255,255,255,0.06)'; g.lineWidth=1; g.stroke();
  });

  g.textAlign='center';
  metrics.forEach(m=>{
    g.font='8px monospace'; g.fillStyle='rgba(255,255,255,0.22)';
    g.fillText(m.label,m.x,py+15);
    // glow pass
    g.font=`bold ${m.big?31:23}px monospace`;
    g.fillStyle=hsl(m.hue,100,55,0.25);
    g.fillText(m.val,m.x+1,py+47);
    // crisp
    g.fillStyle=hsl(m.hue,100,m.big?70:63,1);
    g.fillText(m.val,m.x,py+46);
    g.font='8px monospace'; g.fillStyle=hsl(m.hue,80,45,0.55);
    g.fillText(m.unit,m.x,py+60);
  });
  g.textAlign='left';
})();
</script>
